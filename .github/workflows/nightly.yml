# Extended tier (otfabric/engineering standards/testing.md#ci-tiers).
name: Nightly
on:
  schedule:
    - cron: "47 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  GOWORK: "off"

jobs:
  fuzz:
    name: fuzz (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    # Every third of the 70 targets at 2 minutes each, plus the builds.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make fuzz FUZZTIME=2m FUZZ_SHARD=${{ matrix.shard }}/3
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-corpus-nightly-${{ matrix.shard }}
          path: "**/testdata/fuzz/"

  chaos:
    runs-on: ubuntu-latest
    # Six tests at 5 minutes each, one after the other, plus the build.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Chaos and stress (random seed)
        run: make chaos CHAOS_DURATION=5m CHAOS_TIMEOUT=45m
