# Extended tier (otfabric/engineering standards/testing.md#ci-tiers).
name: Nightly
on:
  schedule:
    - cron: "47 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  GOWORK: "off"

jobs:
  fuzz:
    runs-on: ubuntu-latest
    # 57 targets at 2 minutes each.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make fuzz FUZZTIME=2m
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-corpus-nightly
          path: "**/testdata/fuzz/"

  chaos:
    runs-on: ubuntu-latest
    # Three tests at 10 minutes each, plus the build.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Chaos and stress (random seed)
        run: make chaos CHAOS_DURATION=10m CHAOS_TIMEOUT=40m
