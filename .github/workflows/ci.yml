name: CI
run-name: "CI (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    uses: otfabric/.github/.github/workflows/go-ci.yml@v2.1.0
    with:
      run-govulncheck: true
      coverage-min: "90"
      fuzz-time: 10s
      # 57 Fuzz targets at 10s each do not fit the default 15-minute job limit.
      timeout-minutes: 25
      codecov-name: go-mms
      go-versions: '["1.23","1.24","1.25","1.26"]'
    secrets: inherit

  quality:
    name: Quality gates (per-package coverage ≥90%, chaos)
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Per-package coverage gate
        run: scripts/coverage-gate.sh coverage.out
      - name: Short chaos run (race)
        run: make chaos CHAOS_DURATION=5s
