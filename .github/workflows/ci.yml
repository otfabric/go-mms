name: CI
run-name: "CI (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

on:
  push:
    branches: ["**"]
    paths-ignore: ["**/*.md"]
  pull_request:
    branches: ["**"]
    paths-ignore: ["**/*.md"]

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    uses: otfabric/.github/.github/workflows/go-ci.yml@v3.6.0
    with:
      run-govulncheck: true
      coverage-min: "90"
      fuzz-time: 10s
      # 70 Fuzz targets at 10s each (13 minutes) do not fit the default 15-minute job limit.
      timeout-minutes: 25
      codecov-name: go-mms
      go-versions: '["1.26","1.27"]'
      policy-version: v1.5.0
      # The shared default (v2.1.6) predates Go 1.26; the version `make lint` is checked with.
      golangci-lint-version: v2.15.0
    secrets: inherit

  quality:
    name: Quality gates (per-package coverage ≥90%, chaos)
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
      - name: Per-package coverage gate
        run: make coverage-pkg-check
      - name: Short chaos run (race)
        run: make chaos CHAOS_DURATION=5s
