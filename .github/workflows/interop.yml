name: Interop
run-name: "Interop (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

on:
  push:
    branches: ["**"]
    paths-ignore: ["**/*.md"]
  pull_request:
    branches: ["**"]
    paths-ignore: ["**/*.md"]

permissions:
  contents: read
  packages: read

# Adapter images from the iec61850-interop v1.4.0 release (manifest.json images.*),
# pinned by digest. When iec61850-interop publishes new adapters, bump the
# digests below and the interop/testdata fixture copies (interop.json;
# iec61850/values.json for iec61850bean) together.
env:
  MMS_INTEROP_RELEASE: v1.4.0
  LIBIEC61850_IMAGE: ghcr.io/otfabric/iec61850-interop-libiec61850@sha256:5f865e1917f246763e992701c688a58d157d641ca91674e51bbc342ef945adad
  DSCSYSTEMS_IMAGE: ghcr.io/otfabric/iec61850-interop-dscsystems@sha256:bba8bc1653b4c5bb51c4b8766f0bd99d77dd3523574ed2630b09695212618f2e
  IEC61850RUST_IMAGE: ghcr.io/otfabric/iec61850-interop-iec61850-rust@sha256:c961c039384b0ea968e786a259e1f7a3a4781f2b544ff50d794bd965e991314c
  IEC61850BEAN_IMAGE: ghcr.io/otfabric/iec61850-interop-iec61850bean@sha256:df9b48b5f903ec55f7bcb7baabe651ae204c685702d77979e89165fad00c6416

jobs:
  interop:
    name: ${{ matrix.stack }} interop
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        stack: [libiec61850, dscsystems, iec61850-rust, iec61850bean]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pull before the suite: the harness's 30 s readiness timeout covers
      # only container start, not a slow registry download.
      - name: Pull the peer image
        env:
          MMS_INTEROP_STACK: ${{ matrix.stack }}
        run: |
          case "$MMS_INTEROP_STACK" in
            libiec61850)   img="$LIBIEC61850_IMAGE" ;;
            dscsystems)    img="$DSCSYSTEMS_IMAGE" ;;
            iec61850-rust) img="$IEC61850RUST_IMAGE" ;;
            iec61850bean)  img="$IEC61850BEAN_IMAGE" ;;
          esac
          docker pull -q "$img"

      - name: Run interop suite
        env:
          MMS_INTEROP_STACK: ${{ matrix.stack }}
          # Only the dscsystems client has documented gaps (TESTING.md).
          MMS_INTEROP_REQUIRE_CALLS: ${{ matrix.stack != 'dscsystems' && '1' || '' }}
        run: make interop

      - name: Collect Docker diagnostics
        if: failure()
        run: |
          mkdir -p artifacts
          docker ps -a > artifacts/docker-ps.txt || true
          docker images --digests > artifacts/docker-images.txt || true

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: go-mms-iec61850-interop-diagnostics-${{ matrix.stack }}
          path: artifacts/
