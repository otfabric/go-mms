name: Interop
run-name: "Interop (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  packages: read

# Adapter images from the iec61850-interop v1.1.1 release (manifest.json images.*),
# pinned by digest. When iec61850-interop publishes new adapters, bump the
# digests below and the interop/testdata fixture copies (interop.json;
# iec61850/values.json for iec61850bean) together.
env:
  MMS_INTEROP_RELEASE: v1.1.1
  LIBIEC61850_IMAGE: ghcr.io/otfabric/iec61850-interop-libiec61850@sha256:be48749244ff3a019e0a61062134ed0fa69225b93e86fe50dde085ac2ee9b356
  DSCSYSTEMS_IMAGE: ghcr.io/otfabric/iec61850-interop-dscsystems@sha256:ea4b19da85ffcfb3fadd9ecd65cec3f5688763cdf950f0d16e5b239eb3b825f9
  IEC61850RUST_IMAGE: ghcr.io/otfabric/iec61850-interop-iec61850-rust@sha256:859fd8eced8cf57d97682b994994f85e125294341f302f307058575cf663e720
  IEC61850BEAN_IMAGE: ghcr.io/otfabric/iec61850-interop-iec61850bean@sha256:e8d3327eb783d10ebe9e34773368470d4f0ddda3abe8492bf787874e6e08e898

jobs:
  interop:
    name: ${{ matrix.stack }} interop
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        stack: [libiec61850, dscsystems, iec61850-rust, iec61850bean]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pull before the suite: the harness's 30 s readiness timeout covers
      # only container start, not a slow registry download.
      - name: Pull the peer image
        env:
          MMS_INTEROP_STACK: ${{ matrix.stack }}
        run: |
          case "$MMS_INTEROP_STACK" in
            libiec61850)   img="$LIBIEC61850_IMAGE" ;;
            dscsystems)    img="$DSCSYSTEMS_IMAGE" ;;
            iec61850-rust) img="$IEC61850RUST_IMAGE" ;;
            iec61850bean)  img="$IEC61850BEAN_IMAGE" ;;
          esac
          docker pull -q "$img"

      - name: Run interop suite
        env:
          MMS_INTEROP_STACK: ${{ matrix.stack }}
          # Only the dscsystems client has documented gaps (TESTING.md).
          MMS_INTEROP_REQUIRE_CALLS: ${{ matrix.stack != 'dscsystems' && '1' || '' }}
        run: make interop

      - name: Collect Docker diagnostics
        if: failure()
        run: |
          mkdir -p artifacts
          docker ps -a > artifacts/docker-ps.txt || true
          docker images --digests > artifacts/docker-images.txt || true

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: go-mms-iec61850-interop-diagnostics-${{ matrix.stack }}
          path: artifacts/
