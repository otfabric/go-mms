name: Interop
run-name: "Interop (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  packages: read

# Adapter images from the mms-interop release (manifest.json images.*),
# pinned by digest. When mms-interop publishes new adapters, bump the
# digests below and the interop/testdata/interop.json fixture copy
# together.
env:
  MMS_INTEROP_RELEASE: v0.3.0
  LIBIEC61850_IMAGE: ghcr.io/otfabric/mms-interop-libiec61850@sha256:0ce17d8471eda3a3ef8949a5819b44359a2aeaec23695fee06c5dbea083f0391
  DSCSYSTEMS_IMAGE: ghcr.io/otfabric/mms-interop-dscsystems:v0.3.0
  IEC61850RUST_IMAGE: ghcr.io/otfabric/mms-interop-iec61850-rust:v0.3.0

jobs:
  interop:
    name: ${{ matrix.stack }} MMS interop
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        stack: [libiec61850, dscsystems, iec61850-rust]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run interop suite
        env:
          MMS_INTEROP_STACK: ${{ matrix.stack }}
        run: make interop

      - name: Collect Docker diagnostics
        if: failure()
        run: |
          mkdir -p artifacts
          docker ps -a > artifacts/docker-ps.txt || true
          docker images --digests > artifacts/docker-images.txt || true

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: go-mms-interop-diagnostics-${{ matrix.stack }}
          path: artifacts/
          if-no-files-found: ignore
