# The pull request gate (otfabric/.github PR workflow). Every pull request
# runs this, with no path filter: Docs and Policy always; CI and the four
# interop stacks unless the change is documentation only (pr-changes.yml);
# then "OT Fabric Required Checks", the only check a ruleset requires.
# A branch push runs nothing, and the merge to main runs docs.yml only: the
# heavy workflows ran on this pull request's merge commit already. Releases
# test the release commit in full (release.yml).
name: PR
on:
  pull_request:

permissions:
  contents: read

# A new revision cancels the run of the previous one. Release, nightly and
# dispatched runs are in groups of their own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    uses: otfabric/.github/.github/workflows/pr-changes.yml@6c23fd32380ae9db00fc52b6ac64f0a69826a92d # main after otfabric/.github#20; v3.7.0 once tagged

  docs:
    uses: ./.github/workflows/docs.yml
    secrets: inherit

  ci:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  interop:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/interop.yml

  required:
    name: OT Fabric Required Checks
    needs: [changes, docs, ci, interop]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: otfabric/.github/actions/required-gate@6c23fd32380ae9db00fc52b6ac64f0a69826a92d # main after otfabric/.github#20; v3.7.0 once tagged
        with:
          needs: ${{ toJSON(needs) }}
          required: changes docs
          required-for-code: ci interop
